<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>花与葡萄藤 · 最终组合</title>
  <style>
    :root { color-scheme:light; --page:#f4efe2; --ink:#3d3029; --muted:#76685c; --line:#d8cbbb; --button:#fffaf0; --selected:#65523e; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    main { width:min(100% - 40px,1152px); margin:32px auto; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:18px; }
    h1 { margin:0; font-size:24px; font-weight:600; letter-spacing:.04em; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .backgrounds { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .backgrounds span { margin-right:4px; color:var(--muted); font-size:13px; }
    button,input { font:inherit; }
    button { border:1px solid var(--line); color:var(--ink); background:var(--button); border-radius:7px; padding:8px 13px; cursor:pointer; }
    button:hover { border-color:#9f8b72; }
    button:focus-visible,input:focus-visible { outline:3px solid #bc8e4c; outline-offset:3px; }
    button[aria-pressed="true"] { background:var(--selected); color:#fffaf0; border-color:var(--selected); }
    button:disabled,input:disabled { cursor:default; opacity:.5; }
    .backgrounds button { padding:5px 12px; }
    .controls { display:flex; align-items:center; flex-wrap:wrap; gap:9px; margin:0 0 14px; }
    .visibility { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
    .controls .spacer { flex:1 1 18px; }
    .stage { background:#eef0e8; overflow:hidden; border-radius:9px; }
    canvas { display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; aspect-ratio:8/3; }
    .state-row { display:flex; align-items:center; justify-content:space-between; gap:14px; margin:9px 0 0; color:var(--muted); font-size:13px; }
    .state-row p { margin:0; }
    .proofs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:22px; }
    .proof { min-width:0; }
    .proof-label { margin:0 0 6px; color:var(--muted); font-size:12px; }
    .proof-surface { min-height:144px; display:flex; justify-content:center; overflow:hidden; border-radius:6px; background:#eef0e8; }
    .proof canvas { flex:0 1 384px; width:min(100%,384px); }
    .note { margin:18px 0 0; color:var(--muted); font-size:12px; }
    #status { margin:12px 0 0; color:#a04326; font-size:13px; }
    #status[hidden] { display:none; }
    @media(max-width:840px) {
      .proofs { grid-template-columns:1fr; gap:12px; }
    }
    @media(max-width:600px) {
      main { width:calc(100% - 24px); margin:20px auto; }
      header { align-items:flex-start; flex-direction:column; gap:13px; }
      h1 { font-size:21px; }
      .controls { gap:8px; }
      .controls .spacer { display:none; }
      .visibility { width:100%; }
      button { padding:9px 12px; min-height:42px; }
      .backgrounds button { min-height:36px; }
      .proofs { grid-template-columns:1fr; gap:12px; }
      .state-row { align-items:flex-start; flex-direction:column; gap:3px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>花与葡萄藤</h1>
      <p class="subtitle">完整组合 · 花朵常驻</p>
    </div>
    <div class="backgrounds" role="group" aria-label="预览背景">
      <span>背景</span>
      <button type="button" id="day" aria-pressed="true">浅色</button>
      <button type="button" id="night" aria-pressed="false">深色</button>
    </div>
  </header>
  <div class="controls" role="group" aria-label="展示控制">
    <div class="visibility" role="group" aria-label="展示状态">
      <button type="button" id="show-all" data-ready disabled aria-pressed="false">完整组合</button>
      <button type="button" id="show-flowers" data-ready disabled aria-pressed="false">仅花朵常驻</button>
      <button type="button" id="show-transition" data-ready disabled aria-pressed="true">演示淡出</button>
    </div>
    <span class="spacer"></span>
    <button type="button" id="gust" data-ready disabled>微风</button>
    <button type="button" id="play" data-ready disabled aria-pressed="true">暂停</button>
  </div>
  <div class="stage" id="stage-surface">
    <canvas id="garden" width="384" height="144" role="img" aria-label="花朵、葡萄藤与果串的组合，藤蔓和葡萄淡出后花朵保持在原来的位置。">组合动画需要支持 Canvas 的浏览器。</canvas>
  </div>
  <div class="state-row">
    <p id="view-name" aria-live="polite">正在准备组合</p>
    <p>淡出时花朵保持原位</p>
  </div>
  <div class="proofs" aria-label="同一时刻的常驻大小对照">
    <section class="proof">
      <p class="proof-label">完整组合 · 常驻大小</p>
      <div class="proof-surface"><canvas id="proof-all" width="384" height="144" role="img" aria-label="完整组合的常驻大小预览"></canvas></div>
    </section>
    <section class="proof">
      <p class="proof-label">仅花朵 · 常驻大小</p>
      <div class="proof-surface"><canvas id="proof-flowers" width="384" height="144" role="img" aria-label="只有花朵保留时的常驻大小预览"></canvas></div>
    </section>
  </div>
  <p class="note" id="motion-note">花朵 v2 已封存。花朵常驻，长连接茎、藤蔓和葡萄一起淡出。</p>
  <p id="status" role="alert" hidden></p>
</main>
<script src="flower-engine.js"></script>
<script src="scene.js"></script>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('garden');
  const context = canvas.getContext('2d',{alpha:false});
  const proofs = [
    {canvas:document.getElementById('proof-all'),visibility:'all'},
    {canvas:document.getElementById('proof-flowers'),visibility:'flowers'}
  ];
  const viewName = document.getElementById('view-name');
  const playButton = document.getElementById('play');
  const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  const palette = {day:'#eef0e8',night:'#202b30'};
  const visibilityButtons = {all:'show-all',flowers:'show-flowers',transition:'show-transition'};
  let manifest = null;
  let images = {};
  let ready = false;
  let background = 'day';
  let visibility = 'transition';
  let running = !reducedMotionQuery.matches;
  let elapsed = 0;
  let clockAt = performance.now();
  let clockBase = 0;
  let gustAt = null;
  let lastPaint = -Infinity;
  let latestFrame = null;
  let missingSprites = [];

  function currentTime(now=performance.now()) {
    return running ? clockBase + (now-clockAt)/1000 : elapsed;
  }
  function setTime(value) {
    elapsed = Math.max(0,Number.isFinite(value)?value:0);
    clockBase = elapsed;
    clockAt = performance.now();
  }
  function updatePlayback() {
    playButton.textContent = running ? '暂停' : '播放';
    playButton.setAttribute('aria-pressed',String(running));
  }
  function setRunning(value) {
    const time = currentTime();
    running = value;
    setTime(time);
    updatePlayback();
  }
  function frameOptions(overrides={}) {
    return Object.assign({visibility,transitionAt:4,fadeDuration:2,flowerStage:3,
      flowerStageSince:0,wind:0.52,reducedMotion:reducedMotionQuery.matches,gustAt},overrides);
  }
  function paint(target,frame) {
    const ctx = target.getContext('2d',{alpha:false});
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha = 1;
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = palette[background];
    ctx.fillRect(0,0,target.width,target.height);
    ctx.translate(0,-48);
    const missing = new Set();
    for (const command of frame.commands) {
      ctx.save();
      ctx.globalAlpha = command.opacity === undefined ? 1 : Math.max(0,Math.min(1,command.opacity));
      if (command.type === 'sprite') {
        const sprite = manifest.sprites[command.id];
        if (!sprite || !images[sprite.image]) {missing.add(command.id);ctx.restore();continue;}
        ctx.translate(command.x,command.y);
        ctx.rotate((command.rotation||0)*Math.PI/180);
        ctx.scale(command.scaleX === undefined ? 1 : command.scaleX,command.scaleY === undefined ? 1 : command.scaleY);
        if (command.clipPolygon && command.clipPolygon.length>=3) {
          ctx.beginPath();
          command.clipPolygon.forEach((point,index) => {
            const x = Math.round(Array.isArray(point)?point[0]:point.x);
            const y = Math.round(Array.isArray(point)?point[1]:point.y);
            if (index) ctx.lineTo(x,y); else ctx.moveTo(x,y);
          });
          ctx.closePath();ctx.clip();
        }
        ctx.drawImage(images[sprite.image],sprite.x,sprite.y,sprite.w,sprite.h,
          -sprite.anchorX,-sprite.anchorY,sprite.nativeW,sprite.nativeH);
      } else if (command.type === 'rect') {
        ctx.fillStyle=command.color;
        ctx.fillRect(Math.round(command.x),Math.round(command.y),Math.max(1,Math.round(command.w)),Math.max(1,Math.round(command.h)));
      } else if (command.type === 'line' && command.points && command.points.length) {
        ctx.strokeStyle=command.color;ctx.lineWidth=command.width||1;
        ctx.lineJoin='miter';ctx.lineCap='butt';
        const offset=Math.round(ctx.lineWidth)%2?0.5:0;
        ctx.beginPath();
        command.points.forEach((point,index)=>{
          const x=point[0]+offset,y=point[1]+offset;
          if(index)ctx.lineTo(x,y);else ctx.moveTo(x,y);
        });
        ctx.stroke();
      }
      ctx.restore();
    }
    return Array.from(missing);
  }
  function drawFrame(time,overrides={}) {
    if(!ready)return null;
    const options=frameOptions(overrides);
    const frame=window.CombinedMotion.scene(time,options);
    const missing=new Set(paint(canvas,frame));
    for(const proof of proofs){
      const proofFrame=window.CombinedMotion.scene(time,frameOptions({visibility:proof.visibility}));
      for(const id of paint(proof.canvas,proofFrame))missing.add(id);
    }
    latestFrame=frame;elapsed=time;missingSprites=Array.from(missing);
    const alpha=Number.isFinite(frame.gardenOpacity)?frame.gardenOpacity:0;
    const label=alpha>=0.999?'完整组合':alpha<=0.001?'仅花朵常驻':'藤蔓与葡萄淡出中';
    if(viewName.textContent!==label)viewName.textContent=label;
    return frame;
  }
  function redraw(){return drawFrame(currentTime());}
  function updateVisibilityButtons(){
    for(const [value,id]of Object.entries(visibilityButtons))document.getElementById(id).setAttribute('aria-pressed',String(visibility===value));
  }
  function changeVisibility(value){
    visibility=value;
    if(value==='transition'){
      gustAt=null;running=!reducedMotionQuery.matches;setTime(0);updatePlayback();
    }
    updateVisibilityButtons();redraw();
  }
  for(const [value,id]of Object.entries(visibilityButtons))document.getElementById(id).addEventListener('click',()=>changeVisibility(value));
  function changeBackground(value){
    background=value;
    document.getElementById('day').setAttribute('aria-pressed',String(value==='day'));
    document.getElementById('night').setAttribute('aria-pressed',String(value==='night'));
    document.getElementById('stage-surface').style.background=palette[value];
    for(const surface of document.querySelectorAll('.proof-surface'))surface.style.background=palette[value];
    redraw();
  }
  document.getElementById('day').addEventListener('click',()=>changeBackground('day'));
  document.getElementById('night').addEventListener('click',()=>changeBackground('night'));
  playButton.addEventListener('click',()=>{setRunning(!running);redraw();});
  document.getElementById('gust').addEventListener('click',()=>{gustAt=currentTime();setRunning(true);redraw();});
  reducedMotionQuery.addEventListener('change',()=>{
    if(reducedMotionQuery.matches)setRunning(false);
    document.getElementById('motion-note').textContent=reducedMotionQuery.matches
      ?'已遵循减少动态效果设置。可直接切换完整组合与仅花朵常驻。'
      :'花朵 v2 已封存。花朵常驻，长连接茎、藤蔓和葡萄一起淡出。';
    redraw();
  });
  function animationLoop(now){
    if(ready&&running&&now-lastPaint>=1000/24){drawFrame(currentTime(now));lastPaint=now;}
    requestAnimationFrame(animationLoop);
  }
  window.combinedPreview={
    getState(){return{ready,elapsed,currentTime:currentTime(),running,background,visibility,
      gardenOpacity:latestFrame?latestFrame.gardenOpacity:null,
      commandCount:latestFrame?latestFrame.commands.length:0,
      missingSprites:missingSprites.slice(),width:canvas.width,height:canvas.height};}
  };
  async function load(){
    if(!window.CombinedMotion||typeof window.CombinedMotion.scene!=='function')throw new Error('组合动画尚未准备完成，请稍后重新载入。');
    const response=await fetch('assets.json',{cache:'no-store'});
    if(!response.ok)throw new Error('组合素材尚未准备完成，请稍后重新载入。');
    manifest=await response.json();
    await Promise.all(Object.entries(manifest.images).map(async([key,url])=>{
      const image=new Image();image.src=url;await image.decode();images[key]=image;
    }));
    ready=true;
    for(const control of document.querySelectorAll('[data-ready]'))control.disabled=false;
    setTime(0);updatePlayback();updateVisibilityButtons();drawFrame(0);
    if(reducedMotionQuery.matches)document.getElementById('motion-note').textContent='已遵循减少动态效果设置。可直接切换完整组合与仅花朵常驻。';
    requestAnimationFrame(animationLoop);
  }
  context.fillStyle=palette.day;context.fillRect(0,0,canvas.width,canvas.height);
  load().catch(error=>{
    const status=document.getElementById('status');status.hidden=false;
    status.textContent=error.message||'组合素材载入失败，请稍后重新载入。';viewName.textContent='尚未载入';
  });
})();
</script>
</body>
</html>
